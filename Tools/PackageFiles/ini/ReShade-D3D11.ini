[GENERAL]
EffectSearchPaths=.\reshade-shaders\Shaders
TextureSearchPaths=.\reshade-shaders\Textures
NoReloadOnInit=0
PerformanceMode=0
PresetPath=.\ReShadePreset.ini

[OVERLAY]
TutorialProgress=4
ShowFPS=0

[INPUT]
KeyOverlay=36,0,0,0

[ADDON]
AddonPath=.

[CYGAMECAPTURE]
Verbose=0

; Demonstration : selectionne automatiquement trois tampons des que la frame est
; stable, pour que les trois flux soient la sans rien cliquer.
;   1. la scene propre, avant l'ATH
;   2. le tampon de profondeur, linearise et publie en 16 bits
;   3. l'ATH seul, soit l'image finale moins le flux 1, masque dans l'alpha
; Videz cette ligne pour choisir les tampons a la main dans le Buffer Inspector.
AutoCapture=1280x720:R8G8B8A8_UNORM;1280x720:D24_UNORM_S8_UINT:depth;1280x720:R8G8B8A8_UNORM:hud

; Le plan lointain depend du jeu ; 2 convient a la scene de test. Le defaut est
; 1000, et avec cette valeur la scene de test parait presque noire : c'est
; normal, pas un bug. Reglable en direct dans l'onglet Capture de l'overlay.
DepthFarPlane=2.0

; Les applications de test font de la resolution dynamique : la scene est rendue
; dans une partie seulement d'un tampon de taille fixe, puis agrandie. L'ATH isole
; compare donc l'image finale a un agrandissement de la scene, et un re-echantillonnage
; ne reproduit jamais exactement l'original sur les contrastes fins. Un seuil un peu
; plus haut que le defaut (0.02) absorbe ce residu sans perdre l'interface.
HudThreshold=0.06
HudSoftness=0.12
