name: Publish CyDoc documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .CyDocBuild
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up documentation tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .CyDocBuild/package-lock.json
      - run: npm ci
      - name: Generate the same reader shipped with the application
        run: npm run docs:build
      - name: Validate links, translations, modules and every exported resource
        run: npm run docs:check
      - name: Select the runner's installed browser
        run: echo "CYDOC_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Test the complete reader through file URLs
        run: npm run docs:test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Preserve the public reader root URL
        run: node scripts/BuildPages.mjs
      - name: Upload only the generated documentation
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .CyDocBuild/internal/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the CyDoc reader
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
