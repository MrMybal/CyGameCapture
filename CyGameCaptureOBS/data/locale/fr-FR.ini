Record.Status.Active="Buffers en enregistrement"
Record.Status.Drift="dérive"
Record.AutoStart="Démarrer la prise tout seul"
Record.AutoStart.Description="Commencer l'enregistrement dès que tous les buffers cochés ont une image, sans rien cliquer. Ne se déclenche qu'une fois par lancement d'OBS ; pratique pour enregistrer une session entière sans surveillance."
Record.Mode="Encodage"
Record.Mode.Description="Les modes sans perte court-circuitent l'encodeur matériel et écrivent du FFV1. Attention à ce qu'OBS peut préserver : tout mix vidéo est rendu en BGRA 8 bits, ou en RGBA16F pour les formats 16 bits. Un flux 16 bits comme le depth ne peut donc pas traverser OBS intact, quel que soit le codec."
Record.Mode.Hardware="Encodeur matériel (NVENC / AMF / QuickSync)"
Record.Mode.LosslessRgb="Sans perte, RGB 8 bits (FFV1, exact au bit, conserve l'alpha)"
Record.Mode.Lossless16="Sans perte, 4:4:4 16 bits (FFV1, pour le depth)"
