Record.Encoder.Description="Plusieurs buffers sont encodés en même temps : un encodeur matériel est fortement préférable à x264."
Record.Container="Conteneur"
Record.Container.Description="Le Matroska survit à un plantage ou une coupure de courant, un MP4 inachevé non."
Record.Audio="Piste audio"
Record.Audio.Description="Quelle piste audio d'OBS va dans le fichier. Chaque fichier en porte une : le muxer d'OBS est une sortie audio+vidéo et refuse de démarrer sans encodeur audio, donc un fichier sans piste audio n'est pas proposé. Cela coûte environ 1 Mo par minute, négligeable même sur un buffer de données."
Record.Start="Démarrer l'enregistrement de tous les buffers cochés"
