Record="Record this buffer"
Record.Description="Include this buffer in the take. Every buffer with this on is written to its own file, all started together so the files line up frame for frame."
Record.Folder="Take folder"
Record.Encoder="Encoder"
Record.Encoder.Description="Several buffers are encoded at the same time, so a hardware encoder is strongly preferred over x264."
Record.Container="Container"
Record.Container.Description="Matroska survives a crash or a power cut; an unfinished MP4 does not."
Record.Audio="Audio track"
Record.Audio.Description="Which OBS audio track goes into the file. Every file carries one: OBS' muxer is an audio+video output and refuses to start without an audio encoder, so a video-only file is not on offer. The track costs about 1 MB per minute, negligible even on a data buffer."
Record.Start="Start recording all selected buffers"
Record.Stop="Stop recording"
Record.Status.Active="Recording buffers"
Record.Status.Drift="drift"
Record.AutoStart="Start the take by itself"
Record.AutoStart.Description="Begin recording as soon as every selected buffer has a picture, without clicking anything. Fires once per OBS run; useful for recording a whole session unattended."
Record.Mode="Encoding"
Record.Mode.Description="Lossless modes bypass the hardware encoder and write FFV1. Note what OBS can preserve: every video mix renders into 8-bit BGRA, or into RGBA16F for the 16-bit formats. A 16-bit stream such as depth therefore cannot come through OBS untouched, whatever the codec."
Record.Mode.Hardware="Hardware encoder (NVENC / AMF / QuickSync)"
Record.Mode.LosslessRgb="Lossless, 8-bit RGB (FFV1, bit exact, keeps alpha)"
Record.Mode.Lossless16="Lossless, 16-bit 4:4:4 (FFV1, for depth)"
